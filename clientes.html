.appointment,.card{border:1px solid var(--line);background:var(--surface2);border-radius:16px;padding:11px;min-width:0;overflow:hidden}.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.pill{display:inline-flex;align-items:center;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font:700 10px/1 var(--mono);color:var(--muted);background:var(--surface)}.pill.ok{background:var(--okbg);color:var(--ok);border-color:#bce5ca}.pill.warn{background:var(--warnbg);color:var(--warn);border-color:rgba(140,113,64,.35)}.pill.bad{background:var(--badbg);color:var(--bad);border-color:#edb6ae}

.year{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.month{background:var(--surface2);border:1px solid var(--line);border-radius:15px;padding:10px}.minigrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.dot{height:8px;border-radius:3px;background:var(--surface)}.dot.on{background:var(--gold)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{border-collapse:collapse;width:100%;min-width:760px;background:var(--surface)}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}th{font:700 10px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bars{display:grid;gap:9px}.barrow{display:grid;grid-template-columns:100px 1fr 58px;gap:8px;align-items:center;font-size:12px}.track{height:12px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);overflow:hidden}.fill{height:100%;border-radius:999px;background:var(--gold)}
.chart{display:flex;align-items:flex-end;gap:9px;min-height:180px;padding:10px 0 28px}.bar{flex:1;min-width:32px;border-radius:14px 14px 6px 6px;background:var(--ink);position:relative}.bar.ok{background:var(--ok)}.bar.warn{background:var(--warn)}.bar.bad{background:var(--bad)}.bar span{position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);text-align:center;font-size:10px;color:var(--muted)}
.decision{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--surface2);margin-top:10px}.decision.ok{background:var(--okbg);color:var(--ok)}.decision.warn{background:var(--warnbg);color:var(--warn)}.decision.bad{background:var(--badbg);color:var(--bad)}
.funnel{display:grid;gap:7px}.funnel div{margin:auto;border-radius:12px;background:var(--ink);color:var(--bg);padding:9px;text-align:center;font-size:12px;font-weight:700}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label,.editor label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:650}.full{grid-column:1/-1}
.modal{display:none;position:fixed;inset:0;z-index:100;padding:14px;background:rgba(0,0,0,.54);overflow:auto}.modal.open{display:block}.modalcard{width:min(900px,100%);margin:18px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 26px 80px rgba(0,0,0,.28)}.modalhead{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}
.ocr-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.drop{border:1px dashed var(--line);background:var(--surface2);border-radius:18px;padding:14px;min-height:210px;display:grid;place-items:center;text-align:center}.preview{max-width:100%;border-radius:14px;display:none}.parsed-list{display:grid;gap:8px}.editor{display:grid;gap:10px}.message-preview{white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--muted)}
@media(max-width:1100px){.span9,.span8,.span7,.span6,.span5,.span4,.span3{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.week{grid-template-columns:1fr}.year{grid-template-columns:repeat(2,1fr)}.heatmap-hours{grid-template-columns:repeat(4,1fr)}}
@media(max-width:720px){body{font-size:13px}.app{padding:10px}.topbar{position:relative;top:0;display:block}.actions{margin-top:10px}.hero{padding:15px;border-radius:20px}.hero h1{font-size:23px}.grid,.kpis,.filters,.date-strip,.formgrid,.ocr-grid,.year{grid-template-columns:1fr}.day-layout{grid-template-columns:1fr}.hours{display:none}.calendar{grid-template-columns:1fr}.daycell{min-height:auto}.heatmap-hours{grid-template-columns:repeat(2,1fr)}.barrow{grid-template-columns:78px 1fr 48px}.modalcard{margin:0 auto;border-radius:18px}.head{display:block}}


/* UX 2026 pass: mobile tab dock, no horizontal nav scroll, compact control visuals */
:root{
  --traffic-green:#19c37d;
  --traffic-green-2:#74f2b7;
  --traffic-yellow:#ffd166;
  --traffic-orange:#ff8a3d;
  --traffic-red:#ff3b30;
  --traffic-red-2:#ff7a70;
  --glass:rgba(255,255,255,.76);
}
[data-theme="dark"]{--glass:rgba(18,18,18,.78)}
.nav{overflow:visible;flex-wrap:wrap;align-items:center}
.nav a{min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center}
.hero h1{font-size:clamp(21px,2.2vw,29px);font-weight:600;letter-spacing:-.02em}
h2{font-size:clamp(17px,1.8vw,22px)}
.panel{overflow:hidden}
.control-panel{background:linear-gradient(145deg,var(--surface),rgba(140,113,64,.08));}
.traffic-map{display:grid;gap:10px}
.traffic-row{display:grid;grid-template-columns:minmax(92px,130px) 1fr minmax(70px,96px);gap:10px;align-items:center;border:1px solid var(--line);border-radius:16px;background:var(--surface2);padding:10px}
.traffic-row b{font-size:13px}.traffic-row small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.traffic-value{text-align:right;font-weight:700;font-size:13px}.traffic-track{height:18px;border-radius:999px;background:rgba(0,0,0,.06);overflow:hidden;border:1px solid rgba(0,0,0,.06)}
[data-theme="dark"] .traffic-track{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.08)}
.traffic-fill{height:100%;border-radius:999px;box-shadow:0 0 18px rgba(0,0,0,.14)}
.traffic-fill.ok{background:linear-gradient(90deg,var(--traffic-green),var(--traffic-green-2))}
.traffic-fill.warn{background:linear-gradient(90deg,var(--traffic-yellow),var(--traffic-orange))}
.traffic-fill.bad{background:linear-gradient(90deg,var(--traffic-red),var(--traffic-red-2))}
.chart{gap:11px;min-height:200px;padding:12px 0 34px}
.bar{border-radius:18px 18px 7px 7px;background:linear-gradient(180deg,#475569,#111827);box-shadow:0 12px 30px rgba(17,24,39,.14)}
.bar.ok{background:linear-gradient(180deg,var(--traffic-green-2),var(--traffic-green))}
.bar.warn{background:linear-gradient(180deg,var(--traffic-yellow),var(--traffic-orange))}
.bar.bad{background:linear-gradient(180deg,var(--traffic-red-2),var(--traffic-red))}
.fill{background:linear-gradient(90deg,var(--gold),#c9aa70)}
.decision.warn{background:linear-gradient(135deg,rgba(255,209,102,.18),rgba(255,138,61,.14));border-color:rgba(255,138,61,.30);color:#8a4b00}
.decision.bad{background:linear-gradient(135deg,rgba(255,59,48,.16),rgba(255,122,112,.10));border-color:rgba(255,59,48,.26)}
.decision.ok{background:linear-gradient(135deg,rgba(25,195,125,.16),rgba(116,242,183,.12));border-color:rgba(25,195,125,.28)}
.camera-only{min-height:240px;border-color:rgba(140,113,64,.45);background:linear-gradient(135deg,var(--surface2),rgba(140,113,64,.08))}
.camera-only span:before{content:"";display:block;width:54px;height:42px;border:2px solid var(--gold);border-radius:14px;margin:0 auto 12px;background:linear-gradient(135deg,rgba(140,113,64,.18),transparent)}
@media(max-width:720px){
  .app{padding-bottom:calc(118px + env(safe-area-inset-bottom,0px))}
  .nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0;padding:7px;border-radius:22px;background:var(--glass);backdrop-filter:blur(18px);box-shadow:0 16px 44px rgba(0,0,0,.18);overflow:visible}
  .nav a{font-size:11px;line-height:1.05;min-height:42px;padding:7px 4px;border-radius:14px;white-space:normal}
  .topbar{position:relative;top:0}
  .hero h1{font-size:24px}
  .hero p{font-size:13px}
  .traffic-row{grid-template-columns:1fr;gap:7px}.traffic-value{text-align:left}.traffic-track{height:16px}
  .chart{min-height:170px}
}


/* FIX menú hamburguesa + scanner cámara directa */
.menu-toggle{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--surface);
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:0;
  position:relative;
  z-index:120;
}
.menu-toggle span{
  width:18px;
  height:2px;
  border-radius:999px;
  background:var(--ink);
  transition:transform .22s ease, opacity .18s ease;
}
body.menu-open .menu-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg)}
body.menu-open .menu-toggle span:nth-child(2){opacity:0}
body.menu-open .menu-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.nav-scrim{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.28);
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
  z-index:79;
  backdrop-filter:blur(2px);
}
body.menu-open .nav-scrim{opacity:1;pointer-events:auto}
body.menu-open{overflow:hidden}
.nav{
  position:fixed!important;
  top:76px!important;
  right:14px!important;
  left:auto!important;
  bottom:auto!important;
  z-index:90!important;
  width:min(360px,calc(100vw - 28px))!important;
  max-height:calc(100vh - 96px)!important;
  overflow:auto!important;
  margin:0!important;
  padding:10px!important;
  display:grid!important;
  grid-template-columns:1fr!important;
  gap:7px!important;
  border-radius:22px!important;
  background:rgba(255,255,255,.94)!important;
  backdrop-filter:blur(20px)!important;
  box-shadow:0 24px 70px rgba(0,0,0,.22)!important;
  transform:translate3d(calc(100% + 24px),0,0) scale(.98)!important;
  opacity:0!important;
  pointer-events:none!important;
  transition:transform .26s cubic-bezier(.2,.8,.2,1), opacity .2s ease!important;
}
[data-theme="dark"] .nav{background:rgba(18,18,18,.95)!important}
.nav.open{
  transform:translate3d(0,0,0) scale(1)!important;
  opacity:1!important;
  pointer-events:auto!important;
}
.nav a{
  min-height:46px!important;
  justify-content:flex-start!important;
  text-align:left!important;
  white-space:nowrap!important;
  font-size:14px!important;
  padding:12px 14px!important;
  border-radius:14px!important;
}
.nav a.active{background:var(--gold)!important;color:#fff!important}
.app{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))!important}
@media(max-width:720px){
  .topbar{
    position:sticky!important;
    top:8px!important;
    display:flex!important;
    align-items:center!important;
    justify-content:space-between!important;
    gap:10px!important;
  }
  .brand strong{font-size:12px!important}
  .brand span{font-size:11px!important}
  .actions{margin-top:0!important;display:flex!important;gap:7px!important}
  .actions .btn.primary{display:none!important}
  .nav{
    top:70px!important;
    right:10px!important;
    width:min(340px,calc(100vw - 20px))!important;
    max-height:calc(100vh - 90px)!important;
  }
}
.camera-panel{
  min-height:290px;
  border:1.5px dashed rgba(140,113,64,.42);
  background:linear-gradient(135deg,var(--surface2),rgba(140,113,64,.08));
  border-radius:20px;
  display:grid;
  place-items:center;
  overflow:hidden;
  position:relative;
  padding:14px;
}
.camera-trigger{
  border:0;
  background:transparent;
  width:100%;
  min-height:230px;
  display:grid;
  place-items:center;
  text-align:center;
  color:var(--ink);
}
.camera-trigger b{display:block;font-size:18px;margin-bottom:6px}
.camera-trigger small{color:var(--muted)}
.camera-trigger .camera-icon{
  width:64px;
  height:48px;
  border:2px solid var(--gold);
  border-radius:16px;
  display:block;
  margin:0 auto 14px;
  position:relative;
  background:rgba(140,113,64,.10);
}
.camera-trigger .camera-icon:before{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  border:2px solid var(--gold);
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}
.camera-trigger .camera-icon:after{
  content:"";
  position:absolute;
  width:18px;
  height:8px;
